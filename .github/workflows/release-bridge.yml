name: Release Shoootz.Bridge.TCP

on:
  push:
    tags:
      - 'bridge-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Build_Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        shell: pwsh
        run: dotnet publish Shoootz.Bridge.TCP/Shoootz.Bridge.TCP.csproj -r win-x64 -c Release -o ./out

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ./out/Shoootz.Bridge.TCP.exe

  Create_Release:
    needs: [Build_Windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Zip artifacts
        run: zip -j Shoootz.Bridge.TCP-windows.zip ./artifacts/windows/Shoootz.Bridge.TCP.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#bridge-}"
          gh release create ${{ github.ref_name }} \
            --title "Shoootz.Bridge.TCP $VERSION" \
            --generate-notes \
            "./Shoootz.Bridge.TCP-windows.zip"
