name: Release Shoootz.Bridge.TCP

on:
  push:
    tags:
      - 'bridge-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Build_Windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Shoootz
    steps:
      - uses: actions/checkout@v6
        with:
          path: Shoootz

      - uses: actions/checkout@v6
        with:
          repository: dl-84/Library
          path: Library

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        shell: pwsh
        run: dotnet publish Shoootz.Bridge.TCP/Shoootz.Bridge.TCP.csproj -r win-x64 -c Release -o ./out

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^bridge-v?', ''
          iscc "Shoootz.Bridge.TCP\Scripts\build-windows-installer.iss" /DMyAppVersion=$version /DSourceDir="$PWD\out"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ./Shoootz/out/Shoootz.Bridge.TCP.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ./Shoootz/Shoootz.Bridge.TCP/Scripts/Shoootz.Bridge.TCP-Setup.exe

  Build_Mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Shoootz
    strategy:
      matrix:
        include:
          - rid: osx-x64
            suffix: macos-x64
          - rid: osx-arm64
            suffix: macos-arm64
    steps:
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /Applications/Xcode_15*.app 2>/dev/null || true
          sudo rm -rf /Applications/Xcode_16*.app 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true
          sudo rm -rf ~/Library/Android/sdk 2>/dev/null || true
          sudo rm -rf /usr/local/share/android-commandlinetools 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          brew cleanup --prune=all 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v6
        with:
          path: Shoootz

      - uses: actions/checkout@v6
        with:
          repository: dl-84/Library
          path: Library

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        run: dotnet publish Shoootz.Bridge.TCP/Shoootz.Bridge.TCP.csproj -r ${{ matrix.rid }} -c Release -o ./out

      - name: Create .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE=./out/Shoootz.Bridge.TCP.app
          LOGO=Shoootz.Bridge.TCP/Assets/Logo.png

          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"
          mv ./out/Shoootz.Bridge.TCP "$BUNDLE/Contents/MacOS/"

          ICONSET="$BUNDLE/Contents/Resources/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 64 128 256; do
            sips -z $SIZE $SIZE "$LOGO" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" > /dev/null
          done
          for SIZE in 32 64 128 256; do
            HALF=$((SIZE/2))
            sips -z $SIZE $SIZE "$LOGO" --out "$ICONSET/icon_${HALF}x${HALF}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "$BUNDLE/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

          cat > "$BUNDLE/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>Shoootz TCP Bridge</string>
              <key>CFBundleDisplayName</key><string>Shoootz TCP Bridge</string>
              <key>CFBundleIdentifier</key><string>de.fn.shoootz.bridge</string>
              <key>CFBundleVersion</key><string>$VERSION</string>
              <key>CFBundleShortVersionString</key><string>$VERSION</string>
              <key>CFBundleExecutable</key><string>Shoootz.Bridge.TCP</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          codesign --deep --force --sign - "$BUNDLE"

          SIZE_MB=$(( $(du -sm "$BUNDLE" | cut -f1) + 200 ))

          hdiutil create -volname "Shoootz.Bridge.TCP" \
            -srcfolder "$BUNDLE" -ov -format UDZO \
            -size "${SIZE_MB}m" \
            "./out/Shoootz.Bridge.TCP-${{ matrix.suffix }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: ./Shoootz/out/Shoootz.Bridge.TCP-${{ matrix.suffix }}.dmg

  Build_Linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shoootz
    steps:
      - uses: actions/checkout@v6
        with:
          path: Shoootz

      - uses: actions/checkout@v6
        with:
          repository: dl-84/Library
          path: Library

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        run: dotnet publish Shoootz.Bridge.TCP/Shoootz.Bridge.TCP.csproj -r linux-x64 -c Release -o ./out

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        run: |
          APPDIR=./AppDir
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          mv ./out/Shoootz.Bridge.TCP "$APPDIR/usr/bin/"
          cp Shoootz.Bridge.TCP/Assets/Logo.png "$APPDIR/Shoootz.Bridge.TCP.png"
          cp Shoootz.Bridge.TCP/Assets/Logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/Shoootz.Bridge.TCP.png"

          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/sh
          exec "$APPDIR/usr/bin/Shoootz.Bridge.TCP" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/Shoootz.Bridge.TCP.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Shoootz TCP Bridge
          Exec=Shoootz.Bridge.TCP
          Icon=Shoootz.Bridge.TCP
          Type=Application
          Categories=Sports;
          DESKTOP

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" ./out/Shoootz.Bridge.TCP.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ./Shoootz/out/Shoootz.Bridge.TCP.AppImage

  Create_Release:
    needs: [Build_Windows, Build_Mac, Build_Linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Zip artifacts
        run: |
          zip -j Shoootz.Bridge.TCP-windows.zip      ./artifacts/windows/Shoootz.Bridge.TCP.exe
          zip -j Shoootz.Bridge.TCP-macos-x64.zip    ./artifacts/macos-x64/Shoootz.Bridge.TCP-macos-x64.dmg
          zip -j Shoootz.Bridge.TCP-macos-arm64.zip  ./artifacts/macos-arm64/Shoootz.Bridge.TCP-macos-arm64.dmg
          zip -j Shoootz.Bridge.TCP-linux.zip         ./artifacts/linux/Shoootz.Bridge.TCP.AppImage

      - name: Delete existing release for this tag, if any
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete ${{ github.ref_name }} --yes || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#bridge-}"
          gh release create ${{ github.ref_name }} \
            --title "Shoootz.Bridge.TCP $VERSION" \
            --generate-notes \
            "./Shoootz.Bridge.TCP-windows.zip" \
            "./artifacts/windows-installer/Shoootz.Bridge.TCP-Setup.exe" \
            "./Shoootz.Bridge.TCP-macos-x64.zip" \
            "./Shoootz.Bridge.TCP-macos-arm64.zip" \
            "./Shoootz.Bridge.TCP-linux.zip"
